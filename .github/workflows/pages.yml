name: Deploy WarCore Pages
on:
  push:
    branches: [codex/phase-1-movement]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warcore-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check combat and audio
        run: |
          node tools/check_combat.mjs
          node tools/check_sword_pose.mjs
          node tools/check_audio.mjs
          node tools/check_audio_settings.mjs
          node tools/check_skeleton.mjs
          node tools/check_render_cost.mjs
          node tools/check_resume.mjs
          node tools/check_controls.mjs
          node tools/check_video.mjs
          node tools/check_effects.mjs
      - name: Build game and Lab for repository hosting
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Validate packaged paths
        run: |
          node tools/check_deploy.mjs /${{ github.event.repository.name }}/
          node tools/check_lab_boot.mjs
          node tools/check_lab_assets.mjs
          node tools/check_weapon_models.mjs
          node tools/check_weapon_media.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Publish game and Lab
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
