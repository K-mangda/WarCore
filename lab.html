<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarCore · Weapon Lab</title><style>
@font-face{font-family:Alagard;src:url('/game-ui/alagard.ttf')}*{box-sizing:border-box}body{background:#171f19;color:#f4ead2;font:18px Alagard,serif;margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#29281f}h1{margin:0;font-size:28px}a{color:#f2d18d}main{padding:12px 20px}.panel{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:8px 0 12px}label{display:flex;align-items:center;gap:10px}input{width:180px;accent-color:#70c4ff}button{font:inherit;cursor:pointer;background:#605747;color:#fff1d8;border:2px solid #b6a383;padding:8px 14px}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}#view{height:min(66vh,700px);width:100%;min-height:260px}canvas{display:block;width:100%;height:100%}.note{color:#c7c7b8;font-size:15px;margin-top:12px}#ready{color:#8fceaa}#time{min-width:110px}button:disabled{opacity:.5;cursor:wait}
</style></head><body><header><h1>WEAPON LAB · SWORD</h1><a id="back" href="/">Back to game</a></header><main><span id="ready">Loading...</span><div class="panel"><label>Attack age<input id="frame" aria-label="Attack age" type="range" min="0" max="0.149" step="0.001" value="0.01"></label><label>Facing angle<input id="rotate" aria-label="Facing angle" type="range" min="-180" max="180" step="15" value="0"></label><span id="time"></span></div><div class="panel"><button id="play" disabled>Play attack + sound</button><button id="stop" disabled>Stop</button><button id="mute" aria-pressed="false">Sound on</button><button id="damage" disabled>Show damage number</button></div><div id="view"></div><p class="note">Uses the same Sword renderer, original assets and audio player as the game. More rooms will be added as their systems are ready.</p></main><script type="module" src="/src/dev/SwordPreview.ts"></script></body></html>
