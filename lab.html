<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WARCORE · Lab</title><link rel="icon" type="image/png" href="/branding/warcore-icon.png"/><link rel="apple-touch-icon" href="/branding/warcore-icon.png"/></head><body><header><h1 id="room-title">WEAPON LAB</h1><a id="back" href="./">Back to game</a></header><main><span id="ready">Loading...</span><div class="panel"><label>Weapon<select id="weapon" aria-label="Weapon"><option value="sword">Sword</option><option value="bolt">Firestaff</option><option value="xp">EXP tiers</option><option value="gold">Gold pickup</option><option value="silver">Silver pickup</option><option value="level">Level up</option></select></label><label>Attack age<input id="frame" aria-label="Attack age" type="range" min="0" max="0.149" step="0.001" value="0.01"></label><label>Facing angle<input id="rotate" aria-label="Facing angle" type="range" min="-180" max="180" step="15" value="0"></label><span id="time"></span></div><div class="panel"><button id="play" disabled>Play test + sound</button><button id="stop" disabled>Stop</button><button id="mute" aria-pressed="false">Sound on</button><button id="damage" disabled>Show damage sample</button></div><div id="view"></div><p class="note">Uses the same weapon renderers, original assets and audio player as the game. More rooms will be added as their systems are ready.</p></main><script type="module" src="/src/dev/SwordPreview.ts"></script></body></html>
