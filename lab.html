<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WARCORE · Lab</title><link rel="icon" type="image/png" href="/branding/warcore-icon.png"/><link rel="apple-touch-icon" href="/branding/warcore-icon.png"/><script>
// Runs before the module graph, including when an old cached chunk returns 404.
window.addEventListener('error',function(event){
 const target=event.target;
 if(!(target instanceof HTMLScriptElement || target instanceof HTMLLinkElement && target.rel==='modulepreload'))return;
 const show=function(){
  const status=document.getElementById('ready');if(!status)return;
  status.textContent='Lab scripts could not load. ';
  const retry=document.createElement('a'),url=new URL(location.href);
  url.searchParams.set('reload',Date.now().toString(36));
  retry.href=url.href;retry.textContent='Reload latest Lab';status.append(retry);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show,{once:true});else show();
},true);
</script></head><body><header><h1 id="room-title">WEAPON LAB</h1><a id="back" href="./">Back to game</a></header><main><span id="ready" role="status">Loading...</span><nav class="lab-tabs" role="tablist" aria-label="Lab categories"><button id="tab-weapons" role="tab" aria-selected="true" aria-controls="lab-room-panel" data-category="weapons" disabled>Weapons</button><button id="tab-pickups" role="tab" aria-selected="false" aria-controls="lab-room-panel" data-category="pickups" tabindex="-1" disabled>Pickups</button><button id="tab-effects" role="tab" aria-selected="false" aria-controls="lab-room-panel" data-category="effects" tabindex="-1" disabled>Effects</button><button id="tab-enemies" role="tab" aria-selected="false" aria-controls="lab-room-panel" data-category="enemies" tabindex="-1" disabled>Enemies</button></nav><section id="lab-room-panel" role="tabpanel" aria-labelledby="tab-weapons"><div class="panel"><label>Room<select id="weapon" aria-label="Lab room"><option value="sword">Sword</option><option value="bolt">Firestaff</option><option value="xp">EXP tiers</option><option value="gold">Gold pickup</option><option value="silver">Silver pickup</option><option value="level">Level up</option></select></label><label>Preview time<input id="frame" aria-label="Preview time" type="range" min="0" max="0.149" step="0.001" value="0.01"></label><label>Facing angle<input id="rotate" aria-label="Facing angle" type="range" min="-180" max="180" step="15" value="0"></label><span id="time"></span></div><div class="panel"><button id="play" disabled>Play test + sound</button><button id="stop" disabled>Stop</button><button id="mute" aria-pressed="false">Sound on</button></div><div id="view"></div><p class="note">Uses the same weapon renderers, original assets and audio player as the game. More rooms will be added as their systems are ready.</p></section></main><script type="module" src="/src/dev/SwordPreview.ts"></script></body></html>
